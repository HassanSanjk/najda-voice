<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Najda Voice — Browser Demo</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f3f5f8;
        color: #1c2733;
        display: flex;
        justify-content: center;
        padding: 24px;
      }
      .phone {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        overflow: hidden;
      }
      .header {
        background: #0b6e4f;
        color: #fff;
        padding: 18px 20px;
      }
      .header h1 {
        margin: 0;
        font-size: 18px;
      }
      .header .sub {
        font-size: 13px;
        opacity: 0.85;
        margin-top: 4px;
      }
      .statusbar {
        padding: 12px 20px;
        border-bottom: 1px solid #e8ebef;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #9aa4af;
        display: inline-block;
      }
      .dot.active {
        background: #0b6e4f;
      }
      .controls {
        padding: 16px 20px;
        display: flex;
        gap: 12px;
      }
      button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
      }
      #callBtn {
        background: #0b6e4f;
        color: #fff;
      }
      #callBtn:disabled {
        background: #b9c3cc;
        cursor: default;
      }
      #hangupBtn {
        background: #d64545;
        color: #fff;
      }
      .hidden {
        display: none;
      }
      .panel {
        padding: 0 20px 20px;
      }
      .chip {
        display: inline-block;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        background: #eef4ff;
        color: #1d4ed8;
        margin-bottom: 10px;
      }
      #transcript {
        border: 1px solid #e8ebef;
        border-radius: 10px;
        min-height: 300px;
        max-height: 420px;
        overflow-y: auto;
        padding: 12px;
        background: #fafbfc;
      }
      .turn {
        margin-bottom: 10px;
      }
      .turn .label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #9aa4af;
        margin-bottom: 2px;
      }
      .turn .body {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 10px;
        font-size: 14px;
        line-height: 1.4;
        max-width: 85%;
      }
      .turn.user .body {
        background: #e8ebef;
        color: #1c2733;
      }
      .turn.assistant .body {
        background: #0b6e4f;
        color: #fff;
      }
      audio {
        display: none;
      }
      .footer {
        font-size: 11px;
        color: #9aa4af;
        padding: 10px 20px 16px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="header">
        <h1>نجدة · Najda</h1>
        <div class="sub">AI first aid voice agent — browser demo</div>
      </div>

      <div class="statusbar">
        <span class="dot" id="dot"></span>
        <span id="status">Idle</span>
      </div>

      <audio id="remoteAudio" autoplay></audio>

      <div class="controls">
        <button id="callBtn" onclick="placeCall()">Call</button>
        <button id="hangupBtn" class="hidden" onclick="hangup()">Hang up</button>
      </div>

      <div class="panel">
        <div class="chip hidden" id="scenario"></div>
        <div id="transcript">
          <div class="turn">
            <div class="body" style="color: #9aa4af">Call Najda to start a call. The live transcript appears here.</div>
          </div>
        </div>
      </div>

      <div class="footer">
        Dialer uses Telnyx WebRTC. Backend: <span id="backend">local</span>
      </div>
    </div>

    <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
    <script src="https://unpkg.com/@telnyx/webrtc@2.27.8/lib/bundle.js"></script>
    <script>
      // Destination = the app's DID (config.telnyx_phone_number).
      const DESTINATION = "+1XXXXXXXXXX";

      // Same-origin when served by the app at /demo; otherwise the local
      // backend (browsers treat http://localhost as trustworthy from https).
      const sameOrigin =
        location.protocol === "http:" &&
        ["localhost", "127.0.0.1"].includes(location.hostname);
      const BACKEND_URL = sameOrigin ? "" : "http://localhost:8000";
      document.getElementById("backend").textContent =
        BACKEND_URL || location.origin;

      let client = null;
      let currentCall = null;
      let pollTimer = null;
      let renderedTurns = 0;
      let callSid = null;

      const $ = (id) => document.getElementById(id);

      function setStatus(text) {
        $("status").textContent = text;
        $("dot").classList.toggle("active", text !== "Idle");
      }

      async function placeCall() {
        $("callBtn").disabled = true;
        setStatus("Fetching token…");
        try {
          const res = await fetch(BACKEND_URL + "/telnyx-token");
          const data = await res.json();
          if (!data.token) throw new Error(data.error || "no token returned");

          setStatus("Connecting…");
          client = new TelnyxWebRTC.TelnyxRTC({
            login_token: data.token,
            env: "production",
          });
          client.remoteElement = "remoteAudio";
          client.enableMicrophone();

          client.on("telnyx.ready", () => {
            setStatus("Dialing…");
            currentCall = client.newCall({
              destinationNumber: DESTINATION,
              callerNumber: DESTINATION,
              audio: true,
            });
          });

          client.on("telnyx.notification", (notification) => {
            if (notification.type === "callUpdate") {
              handleCallUpdate(notification.call);
            }
          });

          client.on("telnyx.error", (error) => {
            setStatus("Error: " + (error && error.message ? error.message : error));
            teardown();
          });

          client.on("telnyx.socket.close", () => {
            setStatus("Disconnected");
            teardown();
          });

          client.connect();
        } catch (err) {
          setStatus("Call failed: " + err.message);
          $("callBtn").disabled = false;
        }
      }

      function handleCallUpdate(call) {
        currentCall = call;
        switch (call.state) {
          case "trying":
          case "ringing":
            setStatus("Ringing…");
            break;
          case "active":
            setStatus("In call");
            $("hangupBtn").classList.remove("hidden");
            startPolling();
            break;
          case "hangup":
          case "destroy":
            setStatus("Call ended");
            $("hangupBtn").classList.add("hidden");
            $("callBtn").disabled = false;
            // Let a final snapshot land so trailing turns still render.
            setTimeout(stopPolling, 3000);
            break;
        }
      }

      function hangup() {
        if (currentCall) currentCall.hangup();
        if (client) client.disconnect();
      }

      function teardown() {
        stopPolling();
        if (client) {
          client.off("telnyx.error");
          client.off("telnyx.ready");
          client.off("telnyx.notification");
          client.off("telnyx.socket.close");
          client.disconnect();
          client = null;
        }
        currentCall = null;
        $("hangupBtn").classList.add("hidden");
        $("callBtn").disabled = false;
      }

      async function startPolling() {
        stopPolling();
        callSid = null;
        try {
          const res = await fetch(BACKEND_URL + "/active-calls");
          const data = await res.json();
          callSid = data.newest || null;
        } catch (e) {
          callSid = null;
        }
        if (!callSid) return;
        renderedTurns = 0;
        pollTimer = setInterval(pollTranscript, 1000);
      }

      async function pollTranscript() {
        if (!callSid) return;
        try {
          const res = await fetch(BACKEND_URL + "/transcript/" + callSid);
          if (!res.ok) {
            stopPolling();
            return;
          }
          const data = await res.json();
          if (data.scenario) {
            $("scenario").textContent = "Scenario: " + data.scenario;
            $("scenario").classList.remove("hidden");
          }
          const turns = data.turns || [];
          while (renderedTurns < turns.length) {
            appendTurn(turns[renderedTurns]);
            renderedTurns += 1;
          }
        } catch (e) {
          stopPolling();
        }
      }

      function appendTurn(turn) {
        const row = document.createElement("div");
        row.className = "turn " + (turn.role === "assistant" ? "assistant" : "user");
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = turn.role === "assistant" ? "Najda" : "Caller";
        const body = document.createElement("div");
        body.className = "body";
        body.textContent = turn.content;
        row.appendChild(label);
        row.appendChild(body);
        $("transcript").appendChild(row);
        $("transcript").scrollTop = $("transcript").scrollHeight;
      }

      function stopPolling() {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      }
    </script>
  </body>
</html>
