<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Najda Voice — Browser Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="phone">
      <div class="header">
        <h1>نجدة · Najda</h1>
        <div class="sub">AI first aid voice agent — browser demo</div>
      </div>

      <div class="statusbar">
        <span class="dot" id="dot"></span>
        <span id="status">Idle</span>
      </div>

      <audio id="remoteAudio" autoplay></audio>

      <div class="controls">
        <button id="callBtn">Call</button>
        <button id="hangupBtn" class="hidden">Hang up</button>
      </div>

      <div class="panel">
        <div class="chip hidden" id="scenario"></div>
        <div id="transcript">
          <div class="turn">
            <div class="body" style="color: #9aa4af">Call Najda to start a call. The live transcript appears here.</div>
          </div>
        </div>
      </div>

      <div class="footer">
        Dialer uses Telnyx WebRTC. Backend: <span id="backend">local</span>
      </div>
    </div>

    <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
    <script src="https://unpkg.com/@telnyx/webrtc@2.27.8/lib/bundle.js"></script>
    <script src="app.js"></script>
  </body>
</html>
