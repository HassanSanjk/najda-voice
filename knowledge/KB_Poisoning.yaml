  en: ["poison", "poisoned", "poisoning", "swallowed something", "swallowed pills", "overdose", "overdosed", "ate something toxic", "drank something", "ingested", "took too many pills", "chemical exposure", "inhaled gas", "inhaled fumes", "carbon monoxide", "gas leak", "toxic", "drank bleach", "ate cleaning product", "took poison", "accidental ingestion"]
  ar: ["تسمم", "مسموم", "مسمومة", "تسممت", "ابتلع سم", "ابتلعت", "بلع مادة", "بلع دواء", "جرعة زايدة", "جرعة زائدة", "أخذ حبوب كثيرة", "شرب مادة كيميائية", "استنشق غاز", "غاز سام", "تسرب غاز", "أكل شيء سام", "شرب كلور", "شرب مبيض"]
